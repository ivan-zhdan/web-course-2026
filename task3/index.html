<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Todo-list — Лабораторная №3</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <main class="app">
    <header class="app-header">
      <h1>Список задач</h1>
      <p class="app-sub">Добавляйте, отмечайте и фильтруйте дела. Данные хранятся только в памяти страницы — после перезагрузки список очистится.</p>
    </header>

    <form class="add-form" id="add-form" novalidate>
      <label class="visually-hidden" for="task-input">Новая задача</label>
      <input
        type="text"
        id="task-input"
        name="task"
        placeholder="Например, сделать лабораторную №3"
        autocomplete="off"
      >
      <button type="submit" class="btn btn--primary">Добавить</button>
    </form>

    <p class="form-warning" id="form-warning" role="alert" hidden>
      Введите текст задачи, прежде чем добавить её.
    </p>

    <div class="toolbar">
      <p class="counter" id="counter" aria-live="polite">Осталось: 0, Выполнено: 0</p>

      <div class="filters" id="filters" role="group" aria-label="Фильтр задач">
        <button type="button" class="filter-btn is-active" data-filter="all">Все</button>
        <button type="button" class="filter-btn" data-filter="active">Активные</button>
        <button type="button" class="filter-btn" data-filter="completed">Завершённые</button>
      </div>
    </div>

    <!-- Содержимое списка целиком генерируется в script.js -->
    <ul class="task-list" id="task-list"></ul>

    <p class="empty-state" id="empty-state" hidden>Пока нет задач — добавьте первую.</p>
  </main>

  <script src="script.js" defer></script>
</body>
</html>
