<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Змейка</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="game">
    <h1>Змейка</h1>
    <p class="score">Счёт: <span id="score">0</span></p>
    <div class="board">
      <canvas id="canvas" width="400" height="400"></canvas>
      <button id="restart" type="button" hidden>Начать заново</button>
    </div>
    <p class="hint">Управление: стрелки на клавиатуре</p>
  </main>
  <script src="script.js"></script>
</body>
</html>
